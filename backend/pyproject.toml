[project]
name = "koudai"
version = "0.1.0"
description = "Koudai AI Backend"
requires-python = ">=3.10"
dependencies = [
    "google-genai==2.6.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "aiohttp>=3.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "unit: Fast unit tests with no I/O",
    "integration: Tests requiring network or testnet access",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
